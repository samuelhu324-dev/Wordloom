# Scenario catalog (data-driven) for GitHub Actions drills
#
# Purpose:
# - Centralize scenario metadata that is currently scattered across workflows.
# - Allow future workflows to accept only `scenario_id` and derive defaults/requirements.
#
# Conventions:
# - `id` is the current stable/legacy scenario identifier used by workflows today.
# - `cli` uses placeholders intended for runner/workflow interpolation:
#   - $DATABASE_URL, $RUN_ID, $OUTDIR, $ENV_FILE, $DURATION, $LOOKBACK, $KEEP_LAST
#   - $ES_URL, $ES_INDEX
#   - $WINDOW_DURATION_SECONDS, $WINDOW_INTERVAL_SECONDS, $WINDOW_ENQUEUE_BATCH_SIZE,
#     $WINDOW_MAX_TOTAL_EVENTS, $WINDOW_DRAIN_TIMEOUT_SECONDS, $WINDOW_WORKER_MAX_RUNTIME_SECONDS
#   - Optional scope args (e.g. --library-id/--book-id) can be appended by the runner.
#
# Sources:
# - .github/workflows/drill-write-gate.yml
# - .github/workflows/drill-shadow-verify-entries.yml
# - .github/workflows/failure-drills.yml

version: 1

scenarios:
  - id: shadow_verify_search_index_write_gate
    cli: >-
      python backend/scripts/cli.py labs shadow-verify-search-index-write-gate
      --database-url "$DATABASE_URL"
      --run-id "$RUN_ID"
      --outdir "$OUTDIR"
    requires:
      db: true
      es: false
      jaeger: false
      worker: false
    defaults: {}
    tags:
      - workflow:drill-shadow-verify-entries
      - workflow:drill-verify
      - intent:verify
      - pipeline:search
      - runtime:db_only

  - id: shadow_verify_search_index_paging_stability
    cli: >-
      python backend/scripts/cli.py labs shadow-verify-search-index-paging-stability
      --database-url "$DATABASE_URL"
      --page-size 50
      --pages-checked 2
      --ensure-min-rows 120
      --run-id "$RUN_ID"
      --outdir "$OUTDIR"
    requires:
      db: true
      es: false
      jaeger: false
      worker: false
    defaults:
      page_size: 50
      pages_checked: 2
      ensure_min_rows: 120
    tags:
      - workflow:drill-verify
      - intent:verify
      - pipeline:search
      - runtime:db_only

