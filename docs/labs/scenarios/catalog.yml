      python backend/scripts/cli.py labs shadow-verify-dual-run-stage1
      --database-url "$DATABASE_URL"
      --ensure-min-rows 25
      --candidate-limit 20
      --strategy strict
      --es-url "$ES_URL"
      --es-index "$ES_INDEX"
      --recreate-index
      --backfill-batch-size 200
      --run-id "$RUN_ID"
      --outdir "$OUTDIR"
    requires:
      db: true
      es: true
      jaeger: false
      worker: false
    defaults:
      ensure_min_rows: 25
      candidate_limit: 20
      strategy: strict
      recreate_index: true
      backfill_batch_size: 200
    tags:
      - workflow:drill-dual-run
      - intent:dual_run
      - pipeline:search
      - runtime:db_es

  - id: shadow_verify_dual_run_stage2
