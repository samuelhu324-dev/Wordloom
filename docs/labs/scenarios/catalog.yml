      --database-url "$DATABASE_URL"
      --ensure-min-rows 25
      --candidate-limit 20
      --strategy strict
      --es-url "$ES_URL"
      --es-index "$ES_INDEX"
      --recreate-index
      --worker-batch-size 100
      --worker-concurrency 1
      --worker-poll-interval-seconds 0.2
      --worker-idle-polls-before-exit 2
