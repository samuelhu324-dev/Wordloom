  - id: shadow_verify_dual_run_window
    cli: >-
      python backend/scripts/cli.py labs shadow-verify-dual-run-window
      --database-url "$DATABASE_URL"
      --ensure-min-rows 25
      --candidate-limit 20
      --strategy strict
      --duration-seconds "$WINDOW_DURATION_SECONDS"
      --interval-seconds "$WINDOW_INTERVAL_SECONDS"
      --enqueue-batch-size "$WINDOW_ENQUEUE_BATCH_SIZE"
      --max-total-events "$WINDOW_MAX_TOTAL_EVENTS"
      --drain-timeout-seconds "$WINDOW_DRAIN_TIMEOUT_SECONDS"
      --max-outbox-failed 0
      --max-outbox-pending 0
      --max-outbox-processing 0
      --require-outbox-done-eq-enqueued
      --es-url "$ES_URL"
      --es-index "$ES_INDEX"
      --recreate-index
      --worker-batch-size 100
      --worker-concurrency 1
      --worker-poll-interval-seconds 0.2
      --worker-max-runtime-seconds "$WINDOW_WORKER_MAX_RUNTIME_SECONDS"
      --run-id "$RUN_ID"
      --outdir "$OUTDIR"
    requires:
      db: true
      es: true
      jaeger: false
      worker: false
    defaults:
      ensure_min_rows: 25
      candidate_limit: 20
      strategy: strict
      window_duration_seconds: 15
      window_interval_seconds: 1
      window_enqueue_batch_size: 5
      window_max_total_events: 75
      window_drain_timeout_seconds: 30
      window_worker_max_runtime_seconds: 90
      recreate_index: true
      worker_batch_size: 100
      worker_concurrency: 1
      worker_poll_interval_seconds: 0.2
      max_outbox_failed: 0
      max_outbox_pending: 0
      max_outbox_processing: 0
      require_outbox_done_eq_enqueued: true
    tags:
      - workflow:drill-dual-run
      - intent:dual_run
      - pipeline:search
      - runtime:db_es

