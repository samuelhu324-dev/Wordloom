  - id: all
    cli: |-
      # Workflow-level meta option (matrix expansion).
      # Equivalent to running all FAULT scenarios in failure-drills.yml matrix.
      (see .github/workflows/failure-drills.yml)
    requires:
      db: true
      es: true
      jaeger: true
      worker: false
    defaults:
      env_file: .env.test
      duration_seconds: 25
      lookback: 30m
      keep_last: 20
    tags:
      - workflow:failure-drills
      - intent:fault
      - pipeline:obs_infra
      - runtime:db_es_jaeger
      - meta:matrix_all

