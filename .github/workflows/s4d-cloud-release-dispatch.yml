name: s4d-cloud-release-dispatch

on:
  push:
    branches:
      - S4D-cloud-runtime-deploy-verify-rollback
    paths:
      - .github/workflows/s4d-cloud-release-dispatch.yml
      - scripts/ops/cloud_release*.sh
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Actions environment name for approval/secrets."
        required: true
        type: choice
        default: cloud-dev
        options:
          - cloud-dev
      ssh_host:
        description: "SSH host reachable from the runner. Do not use localhost on GitHub-hosted runners."
        required: true
        type: string
        default: ""
      ssh_port:
        description: "SSH port for the target host."
        required: true
        type: string
        default: "22"
      ssh_user:
        description: "SSH user for the target host."
        required: true
        type: string
        default: "wordloom"
      remote_repo_dir:
        description: "Remote repository directory on the target host."
        required: true
        type: string
        default: "/home/wordloom/work/wordloom-v3"
      env_file:
        description: "Remote env file path to inject into the release workflow."
        required: true
        type: string
        default: "/etc/wordloom/.env.cloud.dev"
      image_tag:
        description: "Candidate image tag."
        required: true
        type: string
        default: "wordloom-backend:cloud-dev"
      known_good_image_tag:
        description: "Optional known-good image tag for rollback."
        required: false
        type: string
        default: ""
      container_name:
        description: "Remote container name."
        required: true
        type: string
        default: "wordloom-api-cloud-dev"
      host_port:
        description: "Remote host port exposed by the backend container."
        required: true
        type: string
        default: "30021"
      api_host:
        description: "API host used during verify."
        required: true
        type: string
        default: "127.0.0.1"
      api_port:
        description: "API port used during verify."
        required: true
        type: string
        default: "30021"
      verify_max_wait_seconds:
        description: "Verify readiness wait window."
        required: true
        type: string
        default: "180"
      verify_poll_interval_seconds:
        description: "Verify polling interval."
        required: true
        type: string
        default: "3"
      access_verify_overlay:
        description: "Run the S4F access-aware verify overlay after generic S4D verify passes."
        required: true
        type: boolean
        default: false
      rollback_on_verify_fail:
        description: "Automatically attempt rollback when verify fails and a known-good image tag is supplied."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: s4d-cloud-release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'cloud-dev' }}
  cancel-in-progress: false

jobs:
  release:
    name: cloud-runtime-release
    runs-on:
      - self-hosted
      - Windows
      - s4d-cloud-dev
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'cloud-dev' }}
    env:
      S4D_TRIGGER_SURFACE: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'auto-dispatch' }}
      S4D_TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'cloud-dev' }}
      S4D_SSH_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_host || '127.0.0.1' }}
      S4D_SSH_PORT: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_port || '22022' }}
      S4D_SSH_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_user || 'wordloom' }}
      S4D_REMOTE_REPO_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.remote_repo_dir || '/home/wordloom/work/wordloom-v3' }}
      S4D_ENV_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.env_file || '/etc/wordloom/.env.cloud.dev' }}
      S4D_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'wordloom-backend:cloud-dev' }}
      S4D_KNOWN_GOOD_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.known_good_image_tag || '' }}
      S4D_CONTAINER_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.container_name || 'wordloom-api-cloud-dev' }}
      S4D_HOST_PORT: ${{ github.event_name == 'workflow_dispatch' && inputs.host_port || '30021' }}
      S4D_API_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.api_host || '127.0.0.1' }}
      S4D_API_PORT: ${{ github.event_name == 'workflow_dispatch' && inputs.api_port || '30021' }}
      S4D_VERIFY_MAX_WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_max_wait_seconds || '180' }}
      S4D_VERIFY_POLL_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_poll_interval_seconds || '3' }}
      S4D_ACCESS_VERIFY_OVERLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.access_verify_overlay || 'false' }}
      S4D_ROLLBACK_ON_VERIFY_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_on_verify_fail || 'false' }}
    defaults:
      run:
        working-directory: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Bootstrap Git Bash on Windows runners
        shell: powershell
        run: |
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          $gitCmd = Join-Path $env:ProgramFiles 'Git\cmd'

          if (-not (Test-Path $gitBash)) {
            Write-Error "Git Bash not found at $gitBash"
            exit 2
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
          if (Test-Path $gitCmd) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitCmd
          }

          "S4D_GIT_BASH=$gitBash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate self-hosted runner contract
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v bash >/dev/null 2>&1; then
            echo "bash not found on self-hosted runner" >&2
            exit 2
          fi

          if ! command -v git >/dev/null 2>&1; then
            echo "git not found on self-hosted runner" >&2
            exit 2
          fi

          if ! command -v ssh >/dev/null 2>&1 && ! command -v ssh.exe >/dev/null 2>&1; then
            echo "ssh client not found on self-hosted runner" >&2
            exit 2
          fi

          case "$S4D_SSH_HOST" in
            "")
              echo "ssh_host is required" >&2
              exit 2
              ;;
          esac

      - name: Record trigger contract
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Trigger Contract"
            echo
            echo "- trigger_surface: $S4D_TRIGGER_SURFACE"
            echo "- target_environment: $S4D_TARGET_ENVIRONMENT"
            echo "- github_ref_name: ${{ github.ref_name }}"
            echo "- github_sha: ${{ github.sha }}"
            echo "- ssh_target: ${S4D_SSH_USER}@${S4D_SSH_HOST}:${S4D_SSH_PORT}"
            echo "- remote_repo_dir: $S4D_REMOTE_REPO_DIR"
            echo "- env_file: $S4D_ENV_FILE"
            echo "- image_tag: $S4D_IMAGE_TAG"
            echo "- container_name: $S4D_CONTAINER_NAME"
            echo "- host_port: $S4D_HOST_PORT"
            echo "- verify_max_wait_seconds: $S4D_VERIFY_MAX_WAIT_SECONDS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate secret contract
        env:
          S4D_SSH_PRIVATE_KEY: ${{ secrets.S4D_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${S4D_SSH_PRIVATE_KEY}" ]; then
            echo "Missing required secret: S4D_SSH_PRIVATE_KEY" >&2
            exit 2
          fi

      - name: Prepare SSH identity
        env:
          S4D_SSH_PRIVATE_KEY: ${{ secrets.S4D_SSH_PRIVATE_KEY }}
          S4D_SSH_KNOWN_HOSTS: ${{ secrets.S4D_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          identity_file="$HOME/.ssh/s4d_cloud_release"
          printf '%s\n' "$S4D_SSH_PRIVATE_KEY" > "$identity_file"
          chmod 600 "$identity_file"
          echo "S4D_SSH_IDENTITY_FILE=$identity_file" >> "$GITHUB_ENV"

          if [ -n "${S4D_SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "$S4D_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
          fi

      - name: Run cloud release workflow
        id: release
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/_tmp_s4d4b_cloud_release_dispatch/${{ github.run_id }}-${{ github.run_attempt }}"
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

          cmd=(
            bash scripts/ops/cloud_release_workflow.sh
            --ssh-host "$S4D_SSH_HOST"
            --ssh-port "$S4D_SSH_PORT"
            --ssh-user "$S4D_SSH_USER"
            --ssh-identity-file "$S4D_SSH_IDENTITY_FILE"
            --remote-repo-dir "$S4D_REMOTE_REPO_DIR"
            --remote-branch "${{ github.ref_name }}"
            --expected-head-sha "${{ github.sha }}"
            --env-file "$S4D_ENV_FILE"
            --image-tag "$S4D_IMAGE_TAG"
            --container-name "$S4D_CONTAINER_NAME"
            --host-port "$S4D_HOST_PORT"
            --api-host "$S4D_API_HOST"
            --api-port "$S4D_API_PORT"
            --verify-max-wait-seconds "$S4D_VERIFY_MAX_WAIT_SECONDS"
            --verify-poll-interval-seconds "$S4D_VERIFY_POLL_INTERVAL_SECONDS"
            --artifact-dir "$artifact_dir"
          )

          if [ -n "$S4D_KNOWN_GOOD_IMAGE_TAG" ]; then
            cmd+=(--known-good-image-tag "$S4D_KNOWN_GOOD_IMAGE_TAG")
          fi

          if [ "$S4D_ROLLBACK_ON_VERIFY_FAIL" = "true" ]; then
            cmd+=(--rollback-on-verify-fail)
          fi

          if [ "$S4D_ACCESS_VERIFY_OVERLAY" = "true" ]; then
            cmd+=(--access-verify-overlay)
          fi

          printf '### Dispatch command (sanitized)\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '\`\`\`bash\n%s\n\`\`\`\n\n' "${cmd[*]//${S4D_SSH_IDENTITY_FILE}/***REDACTED***}" >> "$GITHUB_STEP_SUMMARY"

          set +e
          "${cmd[@]}"
          release_exit_code=$?
          set -e

          echo "release_exit_code=$release_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Locate summary.json
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${{ steps.release.outputs.artifact_dir }}"
          summary_json="$artifact_dir/summary.json"

          echo "summary_json=$summary_json" >> "$GITHUB_OUTPUT"
          if [ -f "$summary_json" ]; then
            echo "summary_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "summary_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write run summary
        if: always()
        env:
          SUMMARY_JSON: ${{ steps.summary.outputs.summary_json }}
          SUMMARY_EXISTS: ${{ steps.summary.outputs.summary_exists }}
          RELEASE_EXIT_CODE: ${{ steps.release.outputs.release_exit_code }}
          ARTIFACT_DIR: ${{ steps.release.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SUMMARY_EXISTS" != "true" ]; then
            {
              echo "### S4D Cloud Release Dispatch"
              echo
              echo "summary.json was not produced."
              echo
              echo "- release_exit_code: $RELEASE_EXIT_CODE"
              echo "- artifact_dir: $ARTIFACT_DIR"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["SUMMARY_JSON"])
          data = json.loads(summary_path.read_text(encoding="utf-8"))
          summary_lines = [
              "### S4D Cloud Release Dispatch",
              "",
              "| Field | Value |",
              "| --- | --- |",
              f"| headSha | {data.get('headSha', 'unknown')} |",
              f"| result | {data.get('result', 'unknown')} |",
              f"| failureClass | {data.get('failureClass', 'unknown')} |",
              f"| terminalGate | {data.get('terminalGate', 'unknown')} |",
              f"| terminalStage | {data.get('terminalStage', 'unknown')} |",
              f"| operatorAction | {data.get('operatorAction', 'unknown')} |",
              f"| evidenceComplete | {data.get('evidenceComplete', 'unknown')} |",
              f"| releaseExitCode | {os.environ.get('RELEASE_EXIT_CODE', 'unknown')} |",
              f"| runnerName | {os.environ.get('RUNNER_NAME', 'unknown')} |",
              "",
              "### Gate Results",
              "",
          ]

          gate_results = data.get("gateResults") or {}
          if gate_results:
              summary_lines.append("| Gate | Result |")
              summary_lines.append("| --- | --- |")
              for key, value in gate_results.items():
                  summary_lines.append(f"| {key} | {value} |")
          else:
              summary_lines.append("No gateResults found in summary.json.")

          access_keys = [
              "accessVerifyResult",
              "memberReadResult",
              "adminReadResult",
              "lifecycleMutationResult",
              "rerenderedStateResult",
          ]
          if any(key in data for key in access_keys):
              summary_lines.extend([
                  "",
                  "### Access Verify Overlay",
                  "",
                  "| Field | Value |",
                  "| --- | --- |",
              ])
              for key in access_keys:
                  summary_lines.append(f"| {key} | {data.get(key, 'unknown')} |")

          artifacts = data.get("artifacts") or {}
          summary_lines.extend([
              "",
              "### Artifact Paths",
              "",
              "| Artifact | Path |",
              "| --- | --- |",
          ])
          for key, value in artifacts.items():
              summary_lines.append(f"| {key} | {value} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary_lines) + "\n")
          PY

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4d-cloud-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo/${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: warn

      - name: Enforce workflow result
        if: always()
        env:
          SUMMARY_JSON: ${{ steps.summary.outputs.summary_json }}
          SUMMARY_EXISTS: ${{ steps.summary.outputs.summary_exists }}
          RELEASE_EXIT_CODE: ${{ steps.release.outputs.release_exit_code }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SUMMARY_EXISTS" != "true" ]; then
            echo "summary.json missing; failing workflow." >&2
            exit 2
          fi

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          from pathlib import Path

          summary = json.loads(Path(os.environ["SUMMARY_JSON"]).read_text(encoding="utf-8"))
          result = summary.get("result")
          failure_class = summary.get("failureClass")
          release_exit_code = int(os.environ.get("RELEASE_EXIT_CODE") or "0")

          print(f"result={result} failureClass={failure_class} releaseExitCode={release_exit_code}")

          if release_exit_code == 0 and result in {"PASS", "PASS_AFTER_ROLLBACK"}:
              raise SystemExit(0)

          raise SystemExit(1)
          PY