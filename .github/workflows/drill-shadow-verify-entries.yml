name: drill-shadow-verify-entries

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Optional scope: book_id (UUID)"
        required: false
        default: ""
        type: string

jobs:
  drill:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start DB (devtest)
        run: |
          set -euo pipefail

          docker compose -f docker-compose.devtest-db.yml up -d --wait

          echo "Waiting for Postgres (wordloom_test)"
          DB_CID="$(docker compose -f docker-compose.devtest-db.yml ps -q db_devtest)"
          if [ -z "$DB_CID" ]; then
            echo "db_devtest container not found" >&2
            exit 2
          fi
          for i in $(seq 1 60); do
            if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            sleep 2
          done

          # The init script that creates wordloom_test only runs on first volume init.
          # Ensure the DB exists and is ready, otherwise migrations/drills will fail.
          if ! docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
            echo "wordloom_test is not ready; ensuring it exists"
            docker exec "$DB_CID" psql -U wordloom -d wordloom_dev -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE wordloom_test' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wordloom_test')\\gexec"
          fi

          echo "Waiting for Postgres (wordloom_test) to be ready"
          for i in $(seq 1 60); do
            if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
              echo "wordloom_test is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for wordloom_test" >&2
          docker exec "$DB_CID" psql -U wordloom -d wordloom_dev -c "\\l" || true
          exit 2

      - name: Install backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Migrate DB (alembic)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail
          python -m alembic -c alembic.ini upgrade head

      - name: Sanity check DB (connect + tables)
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail
          python - << 'PY'
          import os
          import sqlalchemy as sa

          url = os.environ["DATABASE_URL"]
          engine = sa.create_engine(url)
          with engine.connect() as conn:
              conn.execute(sa.text("SELECT 1"))
              # Ensure expected tables exist (migrations should create them).
              for t in ("chronicle_events", "chronicle_entries"):
                  exists = conn.execute(sa.text("SELECT to_regclass(:t)"), {"t": t}).scalar()
                  if not exists:
                      raise SystemExit(f"missing table: {t}")
          print("[ok] DB connect + tables")
          PY

      - name: Run drill (shadow verify) → write artifacts
        id: drill
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail

          scenario="shadow_verify_chronicle_entries"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          rm -rf artifacts .drill_snapshot
          mkdir -p artifacts .drill_snapshot

          # Keep command output as a stable artifact.
          {
            echo "scenario=${scenario}"
            echo "run_id=${run_id}"
            echo "book_id=${{ inputs.book_id }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > artifacts/logs.txt

          set +e
          book_id="${{ inputs.book_id }}"
          if [ -n "${book_id}" ]; then
            book_id_args=("--book-id" "${book_id}")
          else
            book_id_args=()
          fi

          python backend/scripts/cli.py labs shadow-verify-chronicle-entries \
            --database-url "$DATABASE_URL" \
            "${book_id_args[@]}" \
            --run-id "$run_id" \
            --outdir .drill_snapshot \
            2>&1 | tee -a artifacts/logs.txt
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo
            echo "--- snapshot debug ---"
            pwd
            ls -la
            echo "[tree] .drill_snapshot"
            ls -la .drill_snapshot || true
          } >> artifacts/logs.txt

          # Minimal traces placeholder (this drill doesn't collect traces yet).
          echo "[]" > artifacts/traces.json

          if [ -f .drill_snapshot/_result.json ]; then
            cp .drill_snapshot/_result.json artifacts/summary.json
          else
            # Ensure we still have a machine-readable result, even if the lab crashed.
            SCENARIO="$scenario" RUN_ID="$run_id" EXIT_CODE="$rc" python - << 'PY'
            import json
            import os
            from pathlib import Path

            scenario = os.environ.get("SCENARIO", "shadow_verify_chronicle_entries")
            run_id = os.environ.get("RUN_ID")
            exit_code = int(os.environ.get("EXIT_CODE", "2") or "2")
            payload = {
                "scenario": scenario,
                "run_id": run_id,
                "ok": False,
                "error": "missing _result.json",
                "exit_code": exit_code,
            }
            Path(".drill_snapshot").mkdir(parents=True, exist_ok=True)
            Path(".drill_snapshot/_result.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
            Path("artifacts/summary.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
            PY
            rc=2
          fi

          if [ "$rc" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "scenario=${scenario}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"

      - name: Upload summary (success only)
        if: steps.drill.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drill-${{ steps.drill.outputs.scenario }}-${{ steps.drill.outputs.run_id }}
          path: artifacts/summary.json

      - name: Zip artifacts (failure only)
        if: steps.drill.outputs.ok != 'true'
        run: |
          set -euo pipefail
          python - << 'PY'
          import os
          import zipfile

          os.makedirs('artifacts', exist_ok=True)
          with zipfile.ZipFile('artifacts.zip', 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('artifacts'):
                  for f in files:
                      path = os.path.join(root, f)
                      z.write(path, arcname=os.path.relpath(path, 'artifacts'))
          PY

      - name: Upload full zip (failure only)
        if: steps.drill.outputs.ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drill-${{ steps.drill.outputs.scenario }}-${{ steps.drill.outputs.run_id }}
          path: artifacts.zip

      - name: Fail job if drill failed
        if: steps.drill.outputs.ok != 'true'
        run: |
          echo "Drill failed (exit_code=${{ steps.drill.outputs.exit_code }}). See uploaded artifacts." >&2
          exit 1
