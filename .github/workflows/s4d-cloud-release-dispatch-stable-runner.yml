name: s4d-cloud-release-dispatch-stable-runner

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Actions environment name for approval/secrets."
        required: true
        type: choice
        default: cloud-dev
        options:
          - cloud-dev
      ssh_host:
        description: "Direct SSH host reachable from the stable cloud runner."
        required: true
        type: string
        default: ""
      ssh_port:
        description: "SSH port for the target host."
        required: true
        type: string
        default: "22"
      ssh_user:
        description: "SSH user for the target host."
        required: true
        type: string
        default: "wordloom"
      remote_repo_dir:
        description: "Remote repository directory on the target host."
        required: true
        type: string
        default: "/home/wordloom/work/wordloom-v3"
      env_file:
        description: "Remote env file path to inject into the release workflow."
        required: true
        type: string
        default: "/etc/wordloom/.env.cloud.dev"
      image_tag:
        description: "Candidate image tag."
        required: true
        type: string
        default: "wordloom-backend:cloud-dev"
      known_good_image_tag:
        description: "Optional known-good image tag for rollback."
        required: false
        type: string
        default: ""
      container_name:
        description: "Remote container name."
        required: true
        type: string
        default: "wordloom-api-cloud-dev"
      host_port:
        description: "Remote host port exposed by the backend container."
        required: true
        type: string
        default: "30021"
      api_host:
        description: "API host used during verify."
        required: true
        type: string
        default: "127.0.0.1"
      api_port:
        description: "API port used during verify."
        required: true
        type: string
        default: "30021"
      verify_max_wait_seconds:
        description: "Verify readiness wait window."
        required: true
        type: string
        default: "180"
      verify_poll_interval_seconds:
        description: "Verify polling interval."
        required: true
        type: string
        default: "3"
      rollback_on_verify_fail:
        description: "Automatically attempt rollback when verify fails and a known-good image tag is supplied."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: s4d-cloud-release-stable-runner-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  release:
    name: cloud-runtime-release-stable-runner
    runs-on:
      - self-hosted
      - linux
      - x64
      - s4d-cloud
    environment: ${{ inputs.target_environment }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stable runner contract
        run: |
          set -euo pipefail

          for cmd in bash git ssh python; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd not found on stable runner" >&2
              exit 2
            fi
          done

          if [ -z "${{ inputs.ssh_host }}" ]; then
            echo "ssh_host is required" >&2
            exit 2
          fi

      - name: Validate secret contract
        env:
          S4D_SSH_PRIVATE_KEY: ${{ secrets.S4D_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$S4D_SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret: S4D_SSH_PRIVATE_KEY" >&2
            exit 2
          fi

      - name: Prepare SSH identity
        env:
          S4D_SSH_PRIVATE_KEY: ${{ secrets.S4D_SSH_PRIVATE_KEY }}
          S4D_SSH_KNOWN_HOSTS: ${{ secrets.S4D_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          identity_file="$HOME/.ssh/s4d_cloud_release"
          printf '%s\n' "$S4D_SSH_PRIVATE_KEY" > "$identity_file"
          chmod 600 "$identity_file"
          echo "S4D_SSH_IDENTITY_FILE=$identity_file" >> "$GITHUB_ENV"

          if [ -n "$S4D_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$S4D_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
          fi

      - name: Run cloud release workflow
        id: release
        continue-on-error: true
        run: |
          set -euo pipefail

          artifact_dir="artifacts/_tmp_s4d4c_stable_runner_dispatch/${{ github.run_id }}-${{ github.run_attempt }}"
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

          cmd=(
            bash scripts/ops/cloud_release_workflow.sh
            --ssh-host "${{ inputs.ssh_host }}"
            --ssh-port "${{ inputs.ssh_port }}"
            --ssh-user "${{ inputs.ssh_user }}"
            --ssh-identity-file "$S4D_SSH_IDENTITY_FILE"
            --remote-repo-dir "${{ inputs.remote_repo_dir }}"
            --env-file "${{ inputs.env_file }}"
            --image-tag "${{ inputs.image_tag }}"
            --container-name "${{ inputs.container_name }}"
            --host-port "${{ inputs.host_port }}"
            --api-host "${{ inputs.api_host }}"
            --api-port "${{ inputs.api_port }}"
            --verify-max-wait-seconds "${{ inputs.verify_max_wait_seconds }}"
            --verify-poll-interval-seconds "${{ inputs.verify_poll_interval_seconds }}"
            --artifact-dir "$artifact_dir"
          )

          if [ -n "${{ inputs.known_good_image_tag }}" ]; then
            cmd+=(--known-good-image-tag "${{ inputs.known_good_image_tag }}")
          fi

          if [ "${{ inputs.rollback_on_verify_fail }}" = "true" ]; then
            cmd+=(--rollback-on-verify-fail)
          fi

          printf '### Dispatch command (sanitized)\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '\`\`\`bash\n%s\n\`\`\`\n\n' "${cmd[*]//${S4D_SSH_IDENTITY_FILE}/***REDACTED***}" >> "$GITHUB_STEP_SUMMARY"

          set +e
          "${cmd[@]}"
          release_exit_code=$?
          set -e

          echo "release_exit_code=$release_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Locate summary.json
        id: summary
        if: always()
        run: |
          set -euo pipefail

          artifact_dir="${{ steps.release.outputs.artifact_dir }}"
          summary_json="$artifact_dir/summary.json"

          echo "summary_json=$summary_json" >> "$GITHUB_OUTPUT"
          if [ -f "$summary_json" ]; then
            echo "summary_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "summary_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write run summary
        if: always()
        env:
          SUMMARY_JSON: ${{ steps.summary.outputs.summary_json }}
          SUMMARY_EXISTS: ${{ steps.summary.outputs.summary_exists }}
          RELEASE_EXIT_CODE: ${{ steps.release.outputs.release_exit_code }}
          ARTIFACT_DIR: ${{ steps.release.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          if [ "$SUMMARY_EXISTS" != "true" ]; then
            {
              echo "### S4D Cloud Release Dispatch"
              echo
              echo "summary.json was not produced."
              echo
              echo "- release_exit_code: $RELEASE_EXIT_CODE"
              echo "- artifact_dir: $ARTIFACT_DIR"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["SUMMARY_JSON"])
          data = json.loads(summary_path.read_text(encoding="utf-8"))
          summary_lines = [
              "### S4D Cloud Release Dispatch",
              "",
              "| Field | Value |",
              "| --- | --- |",
              f"| headSha | {data.get('headSha', 'unknown')} |",
              f"| result | {data.get('result', 'unknown')} |",
              f"| failureClass | {data.get('failureClass', 'unknown')} |",
              f"| terminalGate | {data.get('terminalGate', 'unknown')} |",
              f"| terminalStage | {data.get('terminalStage', 'unknown')} |",
              f"| operatorAction | {data.get('operatorAction', 'unknown')} |",
              f"| evidenceComplete | {data.get('evidenceComplete', 'unknown')} |",
              f"| releaseExitCode | {os.environ.get('RELEASE_EXIT_CODE', 'unknown')} |",
              f"| runnerName | {os.environ.get('RUNNER_NAME', 'unknown')} |",
              "",
              "### Gate Results",
              "",
          ]

          gate_results = data.get("gateResults") or {}
          if gate_results:
              summary_lines.append("| Gate | Result |")
              summary_lines.append("| --- | --- |")
              for key, value in gate_results.items():
                  summary_lines.append(f"| {key} | {value} |")
          else:
              summary_lines.append("No gateResults found in summary.json.")

          artifacts = data.get("artifacts") or {}
          summary_lines.extend([
              "",
              "### Artifact Paths",
              "",
              "| Artifact | Path |",
              "| --- | --- |",
          ])
          for key, value in artifacts.items():
              summary_lines.append(f"| {key} | {value} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary_lines) + "\n")
          PY

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4d-cloud-release-stable-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: warn

      - name: Enforce workflow result
        if: always()
        env:
          SUMMARY_JSON: ${{ steps.summary.outputs.summary_json }}
          SUMMARY_EXISTS: ${{ steps.summary.outputs.summary_exists }}
          RELEASE_EXIT_CODE: ${{ steps.release.outputs.release_exit_code }}
        run: |
          set -euo pipefail

          if [ "$SUMMARY_EXISTS" != "true" ]; then
            echo "summary.json missing; failing workflow." >&2
            exit 2
          fi

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary = json.loads(Path(os.environ["SUMMARY_JSON"]).read_text(encoding="utf-8"))
          result = summary.get("result")
          failure_class = summary.get("failureClass")
          release_exit_code = int(os.environ.get("RELEASE_EXIT_CODE") or "0")

          print(f"result={result} failureClass={failure_class} releaseExitCode={release_exit_code}")

          if release_exit_code == 0 and result in {"PASS", "PASS_AFTER_ROLLBACK"}:
              raise SystemExit(0)

          raise SystemExit(1)
          PY