name: s2d-hard-gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "backend/scripts/labs/s2d_2a_*.py"
      - "scripts/s2d_hard_gate.py"
      - "scripts/projections/s2d_1a_*.py"
      - "docs/logs/log-S2D-*.md"
      - "artifacts/s2d-runs.json"
      - "docker-compose.devtest-db.yml"
      - ".github/workflows/s2d-hard-gate.yml"
  workflow_dispatch: {}

jobs:
  hard_gate:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start DB (devtest)
        run: |
          set -euo pipefail

          docker compose -f docker-compose.devtest-db.yml up -d --wait

          echo "Waiting for Postgres (wordloom_test)"
          DB_CID="$(docker compose -f docker-compose.devtest-db.yml ps -q db_devtest)"
          if [ -z "$DB_CID" ]; then
            echo "db_devtest container not found" >&2
            exit 2
          fi

          for i in $(seq 1 60); do
            if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            sleep 2
          done

          if ! docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
            echo "wordloom_test is not ready; ensuring it exists"
            docker exec "$DB_CID" psql -U wordloom -d wordloom_dev -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE wordloom_test' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wordloom_test')\\gexec"
          fi

          echo "Waiting for Postgres (wordloom_test) to be ready"
          for i in $(seq 1 60); do
            if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
              echo "wordloom_test is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for wordloom_test" >&2
          docker exec "$DB_CID" psql -U wordloom -d wordloom_dev -c "\\l" || true
          exit 2

      - name: Install backend deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Migrate DB (alembic)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail
          python -m alembic -c alembic.ini upgrade head

      - name: Run S2D hard gate (S2D-1A sample onboarding)
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail
          python scripts/s2d_hard_gate.py --database-url "$DATABASE_URL"

      - name: Generate S2D coverage snapshot for diff check
        run: |
          set -euo pipefail
          python backend/scripts/labs/s2d_2a_p1c1s2_dump_coverage.py --output "artifacts/s2d-coverage-ci-${GITHUB_RUN_ID}.json"

      - name: Run coverage vs SUITE_CATALOG diff (non-blocking)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python backend/scripts/labs/s2d_2a_p3c1s2_diff_suite_catalog.py --coverage-path "artifacts/s2d-coverage-ci-${GITHUB_RUN_ID}.json" | tee "artifacts/s2d-coverage-diff-ci-${GITHUB_RUN_ID}.json"

      - name: Emit S2D coverage diff soft gate warnings (non-blocking)
        run: |
          set -euo pipefail

          DIFF_PATH="artifacts/s2d-coverage-diff-ci-${GITHUB_RUN_ID}.json"
          if [ ! -f "${DIFF_PATH}" ]; then
            echo "[S2D-2A][info] coverage diff JSON not found at ${DIFF_PATH}; skipping soft gate"
            exit 0
          fi

          python - "${DIFF_PATH}" << 'EOF'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:  # pragma: no cover - defensive in CI
              print(f"[S2D-2A][warning] failed to read coverage diff JSON at {path}: {exc}")
              sys.exit(0)

          missing = data.get("missing_in_hard_gate") or []
          mismatched = data.get("mismatched_entries") or {}

          has_warn = False
          if missing:
              print(f"[S2D-2A][warning] missing_in_hard_gate={missing}")
              has_warn = True
          if mismatched:
              suite_ids = sorted(mismatched.keys())
              print(f"[S2D-2A][warning] mismatched_entries_suite_ids={suite_ids}")
              has_warn = True

          if not has_warn:
              print("[S2D-2A][info] no missing_in_hard_gate or mismatched_entries; soft gate clean")
          EOF

      - name: Upload S2D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2d-hard-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/labs/_snapshot/auto/s2d1a_chronicle_daily_stats_backfill_smoke
            docs/labs/_snapshot/auto/s2d1a_chronicle_daily_stats_harness_drill
            artifacts/s2d-runs.json
            artifacts/s2d-coverage-ci-${{ github.run_id }}.json
            artifacts/s2d-coverage-diff-ci-${{ github.run_id }}.json
          if-no-files-found: warn
