name: s0e-pr-body-secondary-enforcement

on:
  workflow_dispatch:
    inputs:
      source_log_path:
        description: "Optional trusted source log path override. Blank lets the workflow resolve attribution first."
        required: false
        type: string
        default: ""
      pr_ref:
        description: "PR number or URL to mirror-verify."
        required: true
        type: string
      repo:
        description: "Optional repository slug override (owner/repo). Blank uses the current repository."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  mirror_verify:
    name: mirror-live-pr-body-contract
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ github.token }}
      S0E_MIRROR_REPO: ${{ inputs.repo != '' && inputs.repo || github.repository }}
      S0E_MIRROR_PR_REF: ${{ inputs.pr_ref }}
      S0E_MIRROR_ARTIFACT_DIR: artifacts/github-actions/pr-body-secondary-enforcement/${{ github.run_id }}-${{ github.run_attempt }}
      S0E_MIRROR_SUMMARY_MD: artifacts/github-actions/pr-body-secondary-enforcement/${{ github.run_id }}-${{ github.run_attempt }}/workflow-summary.md
      S0E_MIRROR_MANIFEST_JSON: artifacts/github-actions/pr-body-secondary-enforcement/${{ github.run_id }}-${{ github.run_attempt }}/artifact-manifest.json
      S0E_ATTRIBUTION_TRUSTED_SOURCE_LOG: ${{ inputs.source_log_path }}
      S0E_ATTRIBUTION_RESULT_JSON: artifacts/github-actions/pr-body-secondary-enforcement/${{ github.run_id }}-${{ github.run_attempt }}/attribution-result.json
      S0E_ATTRIBUTION_PAYLOAD_JSON: artifacts/github-actions/pr-body-secondary-enforcement/${{ github.run_id }}-${{ github.run_attempt }}/attribution-pr-payload.json
      S0E_ATTRIBUTION_CONSOLE_JSON: artifacts/github-actions/pr-body-secondary-enforcement/${{ github.run_id }}-${{ github.run_attempt }}/attribution-console.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare artifact directory
        run: |
          set -euo pipefail

          mkdir -p "$S0E_MIRROR_ARTIFACT_DIR"

      - name: Resolve source-log attribution
        id: attribution
        run: |
          set +e
          set -o pipefail

          ATTRIBUTION_ARGS=()
          if [ -n "$S0E_ATTRIBUTION_TRUSTED_SOURCE_LOG" ]; then
            ATTRIBUTION_ARGS+=(--trusted-source-log-path "$S0E_ATTRIBUTION_TRUSTED_SOURCE_LOG")
          fi

          python scripts/issues/resolve_pr_source_log_attribution.py \
            "$S0E_MIRROR_PR_REF" \
            --repo "$S0E_MIRROR_REPO" \
            --result-path "$S0E_ATTRIBUTION_RESULT_JSON" \
            --snapshot-path "$S0E_ATTRIBUTION_PAYLOAD_JSON" \
            "${ATTRIBUTION_ARGS[@]}" \
            | tee "$S0E_ATTRIBUTION_CONSOLE_JSON"

          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["S0E_ATTRIBUTION_RESULT_JSON"])
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          values = {
              "result": "missing-result-artifact",
              "source_log_path": "",
              "eligible": "false",
              "stop_reason": "missing-result-artifact",
              "winning_surface": "",
              "pr_url": "",
              "pr_payload_path": "",
              "result_path": "",
          }

          if result_path.is_file():
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              values.update(
                  {
                      "result": str(payload.get("result") or "unknown"),
                      "source_log_path": str(payload.get("source_log_path") or ""),
                      "eligible": "true" if payload.get("eligible_for_secondary_enforcement") else "false",
                      "stop_reason": str(payload.get("stop_reason") or ""),
                      "winning_surface": str(payload.get("winning_surface") or ""),
                      "pr_url": str(payload.get("pr_url") or ""),
                      "pr_payload_path": str(payload.get("pr_payload_path") or ""),
                      "result_path": str(payload.get("result_path") or ""),
                  }
              )

          with output_path.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Run live PR body mirror verifier
        id: verify
        if: ${{ steps.attribution.outputs.eligible == 'true' }}
        run: |
          set +e
          set -o pipefail

          python scripts/issues/verify_live_pr_body_contract.py \
            "${{ steps.attribution.outputs.source_log_path }}" \
            "$S0E_MIRROR_PR_REF" \
            --repo "$S0E_MIRROR_REPO" \
            --live-body-path "$S0E_MIRROR_ARTIFACT_DIR/live-pr-body.md" \
            --result-path "$S0E_MIRROR_ARTIFACT_DIR/verify-result.json" \
            | tee "$S0E_MIRROR_ARTIFACT_DIR/verify-console.json"

          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write workflow summary
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["S0E_MIRROR_ARTIFACT_DIR"])
          result_path = artifact_dir / "verify-result.json"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          retained_summary_path = Path(os.environ["S0E_MIRROR_SUMMARY_MD"])
          exit_code = os.environ.get("VERIFY_EXIT_CODE", "")

          lines = [
              "## S0E PR Body Secondary Enforcement",
              "",
              "- Mode: `secondary enforcement`",
              "- PR ref: `{}`".format(os.environ["S0E_MIRROR_PR_REF"]),
              "- Repository: `{}`".format(os.environ["S0E_MIRROR_REPO"]),
          ]

            attribution_path = Path(os.environ["S0E_ATTRIBUTION_RESULT_JSON"])
            attribution_result = "missing-result-artifact"
            attribution_source_log = ""
            if attribution_path.is_file():
              attribution = json.loads(attribution_path.read_text(encoding="utf-8"))
              attribution_result = str(attribution.get("result") or "unknown")
              attribution_source_log = str(attribution.get("source_log_path") or "")
              lines.extend(
                [
                  "- Attribution result: `{}`".format(attribution_result),
                  "- Winning surface: `{}`".format(attribution.get("winning_surface", "")),
                  "- Stop reason: `{}`".format(attribution.get("stop_reason", "")),
                  "- Source log: `{}`".format(attribution_source_log),
                  "- Attribution result artifact: `{}`".format(attribution.get("result_path", "")),
                  "- Attribution PR payload artifact: `{}`".format(attribution.get("pr_payload_path", "")),
                ]
              )
            else:
              lines.extend(
                [
                  "- Attribution result: `missing-result-artifact`",
                  "- Source log: ``",
                ]
              )

          if result_path.is_file():
              data = json.loads(result_path.read_text(encoding="utf-8"))
              lines.extend(
                  [
                      "- Result: `{}`".format(data.get("result", "unknown")),
                      "- PR URL: `{}`".format(data.get("pr_url", "")),
                      "- Live body artifact: `{}`".format(data.get("live_body_path", "")),
                      "- Verify result artifact: `{}`".format(data.get("result_path", "")),
                      "",
                      "This workflow re-checks live state after publish. A failure means post-publish contract drift was detected; it does not mean GitHub Actions prevented the original PR creation.",
                  ]
              )
                  elif attribution_result != "resolved":
                    lines.extend(
                      [
                        "- Verify result: `skipped-before-verifier`",
                        "",
                        "This workflow stopped in attribution before verifier execution. The retained attribution artifact explains why ownership could not be trusted enough to continue.",
                      ]
                    )
          else:
              lines.extend(
                  [
                      "- Result: `missing-result-artifact`",
                      "- Verifier exit code: `{}`".format(exit_code or "unknown"),
                      "",
                      "The mirror verifier did not emit its result artifact, so the workflow cannot prove pass/fail semantics for this run.",
                  ]
              )

          rendered = "\n".join(lines) + "\n"
          summary_path.write_text(rendered, encoding="utf-8")
          retained_summary_path.write_text(rendered, encoding="utf-8")
          print(retained_summary_path.as_posix())
          PY

      - name: Write retained artifact manifest
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["S0E_MIRROR_ARTIFACT_DIR"])
          result_path = artifact_dir / "verify-result.json"
            attribution_result_path = Path(os.environ["S0E_ATTRIBUTION_RESULT_JSON"])
            attribution_payload_path = Path(os.environ["S0E_ATTRIBUTION_PAYLOAD_JSON"])
            attribution_console_path = Path(os.environ["S0E_ATTRIBUTION_CONSOLE_JSON"])
          live_body_path = artifact_dir / "live-pr-body.md"
          console_path = artifact_dir / "verify-console.json"
          summary_path = Path(os.environ["S0E_MIRROR_SUMMARY_MD"])
          manifest_path = Path(os.environ["S0E_MIRROR_MANIFEST_JSON"])
          exit_code = os.environ.get("VERIFY_EXIT_CODE", "")

            result = "missing-result-artifact"
          pr_url = ""
            source_log_path = ""
            attribution_result = "missing-result-artifact"
            stop_reason = "missing-result-artifact"
            attribution_pr_url = ""
            if attribution_result_path.is_file():
              attribution_payload = json.loads(attribution_result_path.read_text(encoding="utf-8"))
              attribution_result = str(attribution_payload.get("result") or "unknown")
              stop_reason = str(attribution_payload.get("stop_reason") or "")
              attribution_pr_url = str(attribution_payload.get("pr_url") or "")
              source_log_path = str(attribution_payload.get("source_log_path") or "")

            if result_path.is_file():
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              result = str(payload.get("result") or "unknown")
              pr_url = str(payload.get("pr_url") or "")
            elif attribution_result != "resolved":
              result = attribution_result
              pr_url = attribution_pr_url

          manifest = {
              "mode": "github-actions-secondary-enforcement-artifact-manifest",
              "result": result,
              "repository": os.environ["S0E_MIRROR_REPO"],
              "source_log_path": source_log_path,
              "pr_ref": os.environ["S0E_MIRROR_PR_REF"],
              "pr_url": pr_url,
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "job": os.environ.get("GITHUB_JOB", ""),
              "attribution": {
                "result": attribution_result,
                "stop_reason": stop_reason,
                "trusted_source_log_override": os.environ.get("S0E_ATTRIBUTION_TRUSTED_SOURCE_LOG", ""),
              },
              "verify_exit_code": exit_code,
              "retained_artifacts": {
                "attribution_result_path": attribution_result_path.as_posix() if attribution_result_path.exists() else "",
                "attribution_pr_payload_path": attribution_payload_path.as_posix() if attribution_payload_path.exists() else "",
                "attribution_console_path": attribution_console_path.as_posix() if attribution_console_path.exists() else "",
                  "live_body_path": live_body_path.as_posix() if live_body_path.exists() else "",
                  "verify_result_path": result_path.as_posix() if result_path.exists() else "",
                  "verify_console_path": console_path.as_posix() if console_path.exists() else "",
                  "workflow_summary_path": summary_path.as_posix() if summary_path.exists() else "",
              },
              "failure_semantics": {
                "classification": (
                  "attribution stop before verifier execution"
                  if attribution_result != "resolved"
                  else ("post-publish drift detected" if result != "pass" else "no drift detected")
                ),
                "failed_stage": "attribution" if attribution_result != "resolved" else ("mirror-verification" if result != "pass" else ""),
                  "primary_publish_owner": "local create path",
                  "github_actions_role": "secondary enforcement",
              },
          }

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=True) + "\n", encoding="utf-8")
          PY

      - name: Emit check annotations
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["S0E_MIRROR_ARTIFACT_DIR"])
          result_path = artifact_dir / "verify-result.json"
            attribution_path = Path(os.environ["S0E_ATTRIBUTION_RESULT_JSON"])

            if not attribution_path.is_file():
              print("::error title=S0E secondary enforcement::attribution result artifact missing; retained artifacts are incomplete")
              raise SystemExit(0)

            attribution = json.loads(attribution_path.read_text(encoding="utf-8"))
            attribution_result = str(attribution.get("result") or "unknown")
            stop_reason = str(attribution.get("stop_reason") or "")
            pr_url = str(attribution.get("pr_url") or "")

            if attribution_result != "resolved":
              print(f"::error title=S0E secondary enforcement::attribution stopped before verifier execution for {pr_url} ({stop_reason})")
              raise SystemExit(0)

            if not result_path.is_file():
              print("::error title=S0E secondary enforcement::mirror verifier result artifact missing after resolved attribution")
              raise SystemExit(0)

            payload = json.loads(result_path.read_text(encoding="utf-8"))
            result = str(payload.get("result") or "unknown")

          if result == "pass":
              print(f"::notice title=S0E secondary enforcement::live PR body contract pass for {pr_url}")
          else:
              print(f"::error title=S0E secondary enforcement::post-publish drift detected for {pr_url}")
          PY

      - name: Upload mirror-verifier artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0e-pr-body-secondary-enforcement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.S0E_ATTRIBUTION_RESULT_JSON }}
            ${{ env.S0E_ATTRIBUTION_PAYLOAD_JSON }}
            ${{ env.S0E_ATTRIBUTION_CONSOLE_JSON }}
            ${{ env.S0E_MIRROR_ARTIFACT_DIR }}/live-pr-body.md
            ${{ env.S0E_MIRROR_ARTIFACT_DIR }}/verify-result.json
            ${{ env.S0E_MIRROR_ARTIFACT_DIR }}/verify-console.json
            ${{ env.S0E_MIRROR_ARTIFACT_DIR }}/workflow-summary.md
            ${{ env.S0E_MIRROR_ARTIFACT_DIR }}/artifact-manifest.json
          if-no-files-found: warn

      - name: Fail on mirrored verification drift
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

            attribution_path = Path(os.environ["S0E_ATTRIBUTION_RESULT_JSON"])
          result_path = Path(os.environ["S0E_MIRROR_ARTIFACT_DIR"]) / "verify-result.json"
            if not attribution_path.is_file():
              print("attribution result artifact missing; secondary enforcement cannot determine attribution outcome", file=sys.stderr)
              raise SystemExit(1)

            attribution = json.loads(attribution_path.read_text(encoding="utf-8"))
            if attribution.get("result") != "resolved":
              print(
                "secondary enforcement stopped before mirror verification because source-log attribution did not resolve cleanly",
                file=sys.stderr,
              )
              raise SystemExit(1)

          if not result_path.is_file():
              print("mirror verifier result artifact missing after resolved attribution; secondary enforcement cannot determine verification outcome", file=sys.stderr)
              raise SystemExit(1)

          data = json.loads(result_path.read_text(encoding="utf-8"))
          if data.get("result") != "pass":
              print("secondary enforcement detected live PR body contract drift after publish", file=sys.stderr)
              raise SystemExit(1)
          PY