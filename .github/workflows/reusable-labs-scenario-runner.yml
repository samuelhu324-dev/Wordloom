name: reusable-labs-scenario-runner

on:
  workflow_call:
    inputs:
      scenario_id:
        description: "Scenario id (legacy) as used by workflows"
        required: true
        type: string
      force_failure:
        description: "Force a failure after scenario run to exercise CI failure evidence path"
        required: false
        type: boolean
        default: false
      env_file:
        description: "Env file path"
        required: true
        type: string
      duration:
        description: "Run duration (seconds)"
        required: true
        type: string
      lookback:
        description: "Jaeger lookback (e.g. 10m, 1h)"
        required: true
        type: string
      keep_last:
        description: "How many snapshots to keep"
        required: true
        type: string

jobs:
  run:
    name: ${{ inputs.scenario_id }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install YAML parser (PyYAML)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Resolve scenario from catalog (cli + requires)
        env:
          SCENARIO_ID: ${{ inputs.scenario_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          from typing import Any

          import yaml

          scenario_id = os.environ["SCENARIO_ID"]
          github_env_path = os.environ.get("GITHUB_ENV")
          if not github_env_path:
            raise SystemExit("GITHUB_ENV not set")

          catalog_path = Path("docs/labs/scenarios/catalog.yml")
          if not catalog_path.exists():
            raise SystemExit(f"catalog not found: {catalog_path}")

          catalog = yaml.safe_load(catalog_path.read_text(encoding="utf-8"))
          scenarios = catalog.get("scenarios")
          if not isinstance(scenarios, list):
            raise SystemExit("invalid catalog: missing scenarios list")

          def matches(item: dict[str, Any]) -> bool:
            if item.get("id") == scenario_id:
              return True
            aliases = item.get("aliases")
            return isinstance(aliases, list) and scenario_id in aliases

          entry = next((item for item in scenarios if isinstance(item, dict) and matches(item)), None)
          if entry is None:
            raise SystemExit(f"scenario not found in catalog: {scenario_id}")

          cli = entry.get("cli")
          if not isinstance(cli, str) or not cli.strip():
            raise SystemExit(f"scenario has empty cli: {scenario_id}")

          requires = entry.get("requires")
          if not isinstance(requires, dict):
            raise SystemExit(f"scenario has invalid requires (expected mapping): {scenario_id}")

          def req_bool(key: str) -> bool:
            v = requires.get(key)
            if not isinstance(v, bool):
              raise SystemExit(f"scenario requires.{key} must be boolean: {scenario_id}")
            return v

          req_db = req_bool("db")
          req_es = req_bool("es")
          req_jaeger = req_bool("jaeger")
          req_worker = req_bool("worker")

          tmp_dir = Path(".tmp")
          tmp_dir.mkdir(parents=True, exist_ok=True)
          script_path = tmp_dir / "scenario-cli.sh"
          script_path.write_text(cli.strip() + "\n", encoding="utf-8", newline="\n")

          def to_str(b: bool) -> str:
            return "true" if b else "false"

          env_lines = [
            f"REQUIRES_DB={to_str(req_db)}",
            f"REQUIRES_ES={to_str(req_es)}",
            f"REQUIRES_JAEGER={to_str(req_jaeger)}",
            f"REQUIRES_WORKER={to_str(req_worker)}",
          ]
          with open(github_env_path, "a", encoding="utf-8") as f:
            for line in env_lines:
              f.write(line + "\n")
          print(f"Wrote {script_path}")
          print("Exported: " + ", ".join(env_lines))
          PY
          chmod +x .tmp/scenario-cli.sh

      - name: Start dependencies (auto; from requires)
        run: |
          set -euo pipefail

          echo "Requires: db=${REQUIRES_DB:-unset} es=${REQUIRES_ES:-unset} jaeger=${REQUIRES_JAEGER:-unset} worker=${REQUIRES_WORKER:-unset}"

          if [ "${REQUIRES_DB:-false}" = "true" ]; then
            docker compose -f docker-compose.devtest-db.yml up -d --wait

            echo "Waiting for Postgres (wordloom_test)"
            DB_CID="$(docker compose -f docker-compose.devtest-db.yml ps -q db_devtest)"
            if [ -z "$DB_CID" ]; then
              echo "db_devtest container not found" >&2
              exit 2
            fi
            for i in $(seq 1 60); do
              if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
                echo "Postgres is ready"
                break
              fi
              sleep 2
            done
          fi

          infra_services=()
          if [ "${REQUIRES_ES:-false}" = "true" ]; then
            infra_services+=("es")
          fi
          if [ "${REQUIRES_JAEGER:-false}" = "true" ]; then
            infra_services+=("jaeger")
          fi

          if [ "${#infra_services[@]}" -gt 0 ]; then
            docker compose -f docker-compose.infra.yml up -d --wait "${infra_services[@]}"
          fi

          if [ "${REQUIRES_ES:-false}" = "true" ]; then
            echo "Waiting for Elasticsearch (http://localhost:19200)"
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:19200 >/dev/null; then
                echo "Elasticsearch is up"
                break
              fi
              sleep 2
            done
          fi

      - name: Install backend (+ YAML parser)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyyaml

      - name: Prepare env file (CI)
        run: |
          set -euo pipefail

          # The runner executes Python on the host, while DB/ES/Jaeger run in docker
          # with localhost port-maps from docker-compose.*.yml.
          tracing_enabled=0
          if [ "${REQUIRES_JAEGER:-false}" = "true" ]; then
            tracing_enabled=1
          fi

          cat > .env.test << EOF
          WORDLOOM_ENV=test
          ENVIRONMENT=ci-test
          DEBUG=False
          LOG_LEVEL=WARNING

          API_PORT=30011
          OUTBOX_METRICS_PORT=9109

          DATABASE_URL=postgresql+psycopg://wordloom:wordloom@localhost:5435/wordloom_test
          ELASTIC_URL=http://localhost:19200
          ELASTIC_INDEX=wordloom-test-search-index

          WORDLOOM_TRACING_ENABLED=${tracing_enabled}
          EOF

          if [ "$tracing_enabled" = "1" ]; then
            cat >> .env.test << 'EOF'
          OTEL_TRACES_SAMPLER=always_on
          OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
          OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
          EOF
          fi

      - name: Environment fingerprint (CI)
        run: |
          set -euo pipefail

          {
            echo "## Environment fingerprint"
            echo
            echo "### Repo"
            echo "- PWD: $(pwd)"
            echo "- SHA: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo
            echo "### Versions"
            echo "\`\`\`"
            python --version
            python -m pip --version
            echo "\`\`\`"
            echo
            echo "### pip freeze (head)"
            echo "\`\`\`"
            python -m pip freeze | head -n 50 || true
            echo "\`\`\`"
            echo
            echo "### Key env (masked)"
            echo "\`\`\`"
            (env | sort | grep -E '^(WORDLOOM_ENV|ENVIRONMENT|DEBUG|LOG_LEVEL|API_PORT|OUTBOX_METRICS_PORT|DATABASE_URL|ELASTIC_URL|ELASTIC_INDEX|WORDLOOM_TRACING_ENABLED|OTEL_)=' \
              | sed -E 's/(=).*/=***REDACTED***/') || true
            echo "\`\`\`"
            echo
            echo "### .env.test (masked)"
            echo "\`\`\`"
            if [ -f .env.test ]; then
              sed -E 's/(=).*/=***REDACTED***/' .env.test
            else
              echo ".env.test not found"
            fi
            echo "\`\`\`"
            echo
            echo "### Docker"
            echo "\`\`\`"
            docker ps || true
            echo
            docker compose -f docker-compose.infra.yml ps || true
            echo
            docker compose -f docker-compose.devtest-db.yml ps || true
            echo "\`\`\`"
            echo
            echo "### Endpoints"
            echo "\`\`\`"
            curl -sS -o /dev/null -w 'ES http://localhost:19200 -> %{http_code}\n' http://localhost:19200 || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate DB (alembic)
        working-directory: backend
        run: |
          set -euo pipefail
          set -a
          source ../.env.test
          set +a
          python -m alembic -c alembic.ini upgrade head

      - name: Run scenario (catalog-driven)
        env:
          FAULT_SCENARIO: ${{ inputs.scenario_id }}
          PYTHONPATH: backend
        run: |
          set -euo pipefail

          env_file="${{ inputs.env_file }}"
          if [ ! -f "$env_file" ]; then
            echo "env_file not found: $env_file" >&2
            echo "Expected a repo-relative path; using .env.test" >&2
            env_file=".env.test"
          fi

          set -a
          source "$env_file"
          set +a

          scenario="${{ inputs.scenario_id }}"
          safe_scenario="${scenario//\//_}"
          run_id="${{ github.run_id }}-${{ github.run_attempt }}-${safe_scenario}"
          echo "=== scenario=${scenario} run_id=${run_id} ==="

          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

          export ENV_FILE="$env_file"
          export DURATION="${{ inputs.duration }}"
          export LOOKBACK="${{ inputs.lookback }}"
          export KEEP_LAST="${{ inputs.keep_last }}"
          export RUN_ID="$run_id"

          bash ./.tmp/scenario-cli.sh

      - name: Contract check (_result.json)
        if: always()
        run: |
          set -euo pipefail

          run_id="${RUN_ID:-}"
          if [ -z "$run_id" ]; then
            echo "RUN_ID not set; cannot locate _result.json" >&2
            exit 2
          fi

          mapfile -t matches < <(find docs/labs/_snapshot/auto -type f -path "*/${run_id}/_result.json" | sort)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "missing _result.json for run_id=${run_id}" >&2
            exit 2
          fi
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "ambiguous _result.json matches for run_id=${run_id}:" >&2
            printf ' - %s\n' "${matches[@]}" >&2
            exit 2
          fi

          result_path="${matches[0]}"
          echo "Found _result.json: ${result_path}"

          python - <<'PY' "$result_path"
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
            data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:  # noqa: BLE001
            print(f"failed to parse _result.json: {path} ({exc})", file=sys.stderr)
            raise SystemExit(2)

          ok = data.get("ok")
          scenario = data.get("scenario")
          run_dir = data.get("run_dir")
          print(f"scenario={scenario} ok={ok} run_dir={run_dir}")

          if ok is not True:
            checks = data.get("checks")
            observed = data.get("observed")
            reason_contract = data.get("reason_contract")
            print("_result.json.ok is not true; failing CI", file=sys.stderr)
            print(f"checks={checks}", file=sys.stderr)
            print(f"observed={observed}", file=sys.stderr)
            print(f"reason_contract={reason_contract}", file=sys.stderr)
            raise SystemExit(1)
          PY

      - name: Force failure (manual test)
        if: ${{ inputs.force_failure }}
        run: |
          echo "Forced failure requested (force_failure=true)" >&2
          exit 1

      - name: Compute artifact-safe scenario id
        if: always()
        env:
          SCENARIO_ID: ${{ inputs.scenario_id }}
        run: |
          set -euo pipefail
          safe="${SCENARIO_ID//\//_}"
          echo "SAFE_SCENARIO_ID=$safe" >> "$GITHUB_ENV"

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs-evidence-${{ env.SAFE_SCENARIO_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/labs/_snapshot/auto/
