name: failure-drills

on:
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Force a failure after scenario run to exercise CI failure evidence path"
        required: false
        type: boolean
        default: false
      scenario:
        description: "labs scenario"
        required: true
        type: choice
        options:
          - all
          - es_429_inject
          - es_write_block_4xx
          - es_down_connect
          - collector_down
          - es_bulk_partial
          - db_claim_contention
          - stuck_reclaim
          - duplicate_delivery
          - projection_version
      env_file:
        description: "Env file path"
        required: true
        default: ".env.test"
        type: string
      duration:
        description: "Run duration (seconds)"
        required: true
        default: "25"
        type: string
      lookback:
        description: "Jaeger lookback (e.g. 10m, 1h)"
        required: true
        default: "30m"
        type: string
      keep_last:
        description: "How many snapshots to keep"
        required: true
        default: "20"
        type: string

jobs:
  drills:
    uses: ./.github/workflows/reusable-labs-scenario-runner.yml

    strategy:
      fail-fast: false
      matrix:
        scenario: >-
          ${{ fromJSON(
            inputs.scenario == 'all'
            && '["es_429_inject","es_write_block_4xx","es_down_connect","collector_down","es_bulk_partial","db_claim_contention","stuck_reclaim","duplicate_delivery","projection_version"]'
            || format('["{0}"]', inputs.scenario)
          ) }}

    with:
      scenario_id: ${{ matrix.scenario }}
      force_failure: ${{ inputs.force_failure }}
      env_file: ${{ inputs.env_file }}
      duration: ${{ inputs.duration }}
      lookback: ${{ inputs.lookback }}
      keep_last: ${{ inputs.keep_last }}
