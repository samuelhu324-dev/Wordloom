name: reusable-drill-shadow-verify-entries-runner

on:
  workflow_call:
    inputs:
      scenario:
        description: "Scenario"
        required: true
        type: string
      book_id:
        description: "Optional scope: book_id (UUID)"
        required: false
        default: ""
        type: string
      library_id:
        description: "Optional scope: library_id (UUID)"
        required: false
        default: ""
        type: string

jobs:
  drill:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start DB (devtest)
        run: |
          set -euo pipefail

          docker compose -f docker-compose.devtest-db.yml up -d --wait

          echo "Waiting for Postgres (wordloom_test)"
          DB_CID="$(docker compose -f docker-compose.devtest-db.yml ps -q db_devtest)"
          if [ -z "$DB_CID" ]; then
            echo "db_devtest container not found" >&2
            exit 2
          fi
          for i in $(seq 1 60); do
            if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            sleep 2
          done

          # The init script that creates wordloom_test only runs on first volume init.
          # Ensure the DB exists and is ready, otherwise migrations/drills will fail.
          if ! docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
            echo "wordloom_test is not ready; ensuring it exists"
            docker exec "$DB_CID" psql -U wordloom -d wordloom_dev -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE wordloom_test' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wordloom_test')\\gexec"
          fi

          echo "Waiting for Postgres (wordloom_test) to be ready"
          for i in $(seq 1 60); do
            if docker exec "$DB_CID" pg_isready -U wordloom -d wordloom_test >/dev/null 2>&1; then
              echo "wordloom_test is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for wordloom_test" >&2
          docker exec "$DB_CID" psql -U wordloom -d wordloom_dev -c "\\l" || true
          exit 2

      - name: Install backend (+ YAML parser)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyyaml

      - name: Migrate DB (alembic)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail
          python -m alembic -c alembic.ini upgrade head

      - name: Sanity check DB (connect + tables)
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          python - << 'PY'
          import os
          import sqlalchemy as sa

          url = os.environ["DATABASE_URL"]
          scenario = os.environ.get("SCENARIO") or "shadow_verify_chronicle_entries"
          engine = sa.create_engine(url)
          with engine.connect() as conn:
              conn.execute(sa.text("SELECT 1"))
              if scenario in ("shadow_verify_search_index", "shadow_verify_search_index_write_gate"):
                  expected = ("search_index",)
              else:
                  expected = ("chronicle_events", "chronicle_entries")

              for t in expected:
                  exists = conn.execute(sa.text("SELECT to_regclass(:t)"), {"t": t}).scalar()
                  if not exists:
                      raise SystemExit(f"missing table: {t}")
          print("[ok] DB connect + tables")
          PY

      - name: Run drill (shadow verify) → write artifacts
        id: drill
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+psycopg://wordloom:wordloom@127.0.0.1:5435/wordloom_test
        run: |
          set -euo pipefail

          scenario="${{ inputs.scenario }}"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rc=2
          ok=false

          rm -rf artifacts .drill_snapshot .tmp
          mkdir -p artifacts .drill_snapshot .tmp

          # IMPORTANT: write default outputs immediately so downstream steps never see empty
          # values even if this script crashes before the EXIT trap runs.
          {
            echo "ok=${ok}"
            echo "scenario=${scenario}"
            echo "run_id=${run_id}"
            echo "exit_code=${rc}"
          } >> "$GITHUB_OUTPUT"

          # Also create a placeholder summary early; finalize() will overwrite it.
          python backend/scripts/ci/workflow_artifacts.py placeholder \
            --scenario "${scenario}" \
            --artifacts-dir artifacts

          finalize() {
            {
              echo
              echo "--- snapshot debug ---"
              pwd
              ls -la
              echo "[tree] .drill_snapshot"
              ls -la .drill_snapshot || true
            } >> artifacts/logs.txt 2>&1 || true

            python backend/scripts/ci/workflow_artifacts.py finalize \
              --scenario "${scenario}" \
              --run-id "${run_id}" \
              --exit-code "${rc}" \
              --snapshot-dir .drill_snapshot \
              --artifacts-dir artifacts

            echo "ok=${ok}" >> "$GITHUB_OUTPUT"
            echo "scenario=${scenario}" >> "$GITHUB_OUTPUT"
            echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
            echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          }

          trap 'SCENARIO="$scenario" RUN_ID="$run_id" EXIT_CODE="$rc" finalize' EXIT

          {
            echo "scenario=${scenario}"
            echo "run_id=${run_id}"
            echo "book_id=${{ inputs.book_id }}"
            echo "library_id=${{ inputs.library_id }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > artifacts/logs.txt

          {
            echo "--- repo ---"
            git rev-parse HEAD || true
            git status --porcelain=v1 -b || true
            echo
            echo "--- python ---"
            python --version || true
            python -m pip --version || true
            echo
            echo "--- cli.py --help ---"
            python backend/scripts/cli.py --help || true
            echo
            echo "--- cli.py labs --help ---"
            python backend/scripts/cli.py labs --help || true
            echo
            echo "--- cli.py labs shadow-verify-chronicle-entries --help ---"
            python backend/scripts/cli.py labs shadow-verify-chronicle-entries --help || true
            echo
            echo "--- cli.py labs shadow-verify-search-index --help ---"
            python backend/scripts/cli.py labs shadow-verify-search-index --help || true
            echo
          } >> artifacts/logs.txt 2>&1

          export RUN_ID="$run_id"
          export SCENARIO="$scenario"
          export OUTDIR=".drill_snapshot"
          export DATABASE_URL="$DATABASE_URL"
          export BOOK_ID="${{ inputs.book_id }}"
          export LIBRARY_ID="${{ inputs.library_id }}"

          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          import yaml

          scenario_input = os.environ["SCENARIO"]
          book_id = os.environ.get("BOOK_ID", "").strip()
          library_id = os.environ.get("LIBRARY_ID", "").strip()

          catalog_path = Path("docs/labs/scenarios/catalog.yml")
          if not catalog_path.exists():
            raise SystemExit(f"catalog not found: {catalog_path}")

          catalog = yaml.safe_load(catalog_path.read_text(encoding="utf-8"))
          scenarios = catalog.get("scenarios")
          if not isinstance(scenarios, list):
            raise SystemExit("invalid catalog: missing scenarios list")

          def matches(item: dict) -> bool:
            if item.get("id") == scenario_input:
              return True
            aliases = item.get("aliases")
            if isinstance(aliases, list) and scenario_input in aliases:
              return True
            return False

          entry = next((item for item in scenarios if isinstance(item, dict) and matches(item)), None)
          if entry is None:
            raise SystemExit(f"scenario not found in catalog: {scenario_input}")

          canonical_id = entry.get("id")
          if not isinstance(canonical_id, str) or not canonical_id.strip():
            raise SystemExit(f"scenario has empty id: {scenario_input}")

          cli = entry.get("cli")
          if not isinstance(cli, str) or not cli.strip():
            raise SystemExit(f"scenario has empty cli: {scenario_input}")

          line = cli.strip()

          if canonical_id == "verify/chronicle/entries":
            if book_id:
              line = f"{line} --book-id \"$BOOK_ID\""
          elif canonical_id in ("verify/search/index_consistency", "verify/search/write_gate_idempotency"):
            if library_id:
              line = f"{line} --library-id \"$LIBRARY_ID\""
          else:
            raise SystemExit(
              f"unsupported scenario for this workflow: input={scenario_input} canonical={canonical_id}"
            )

          script_path = Path(".tmp/scenario-cli.sh")
          script_path.write_text(
            "#!/usr/bin/env bash\nset -euo pipefail\n" + line + "\n",
            encoding="utf-8",
            newline="\n",
          )
          print(f"Wrote {script_path}")
          PY

          chmod +x .tmp/scenario-cli.sh

          set +e
          bash ./.tmp/scenario-cli.sh 2>&1 | tee -a artifacts/logs.txt
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ]; then
            ok=true
          else
            ok=false
          fi

      - name: Upload summary (success only)
        if: steps.drill.conclusion != 'skipped' && steps.drill.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drill-${{ steps.drill.outputs.scenario }}-${{ steps.drill.outputs.run_id }}
          path: artifacts/summary.json

      - name: Zip artifacts (failure only)
        if: steps.drill.conclusion != 'skipped' && steps.drill.outputs.ok != 'true'
        run: |
          set -euo pipefail
          python backend/scripts/ci/workflow_artifacts.py zip \
            --artifacts-dir artifacts \
            --zip-path artifacts.zip

      - name: Upload full zip (failure only)
        if: steps.drill.conclusion != 'skipped' && steps.drill.outputs.ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drill-${{ steps.drill.outputs.scenario }}-${{ steps.drill.outputs.run_id }}
          path: artifacts.zip

      - name: Fail job if drill failed
        if: steps.drill.conclusion != 'skipped' && steps.drill.outputs.ok != 'true'
        run: |
          echo "Drill failed (exit_code=${{ steps.drill.outputs.exit_code }})." >&2
          if [ -f artifacts/summary.json ]; then
            echo "--- summary.json ---" >&2
            cat artifacts/summary.json >&2
          fi
          if [ -f artifacts/logs.txt ]; then
            echo "--- logs.txt (tail) ---" >&2
            tail -n 200 artifacts/logs.txt >&2 || true
          fi
          echo "See uploaded artifacts." >&2
          exit 1
