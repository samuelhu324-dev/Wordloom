name: drill-write-gate

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Write-gate scenario"
        required: true
        default: shadow_verify_dual_run_readiness_gate
        type: choice
        options:
          - shadow_verify_dual_run_readiness_gate
          - shadow_verify_canary_dual_write
          - shadow_verify_dual_write_sampling
      library_id:
        description: "Optional data scope: library_id (UUID). Scopes seed+enqueue/outbox.library_id."
        required: false
        default: ""
        type: string

jobs:
  drill:
    uses: ./.github/workflows/reusable-drill-write-gate-runner.yml
    with:
      scenario: ${{ inputs.scenario }}
      library_id: ${{ inputs.library_id }}


